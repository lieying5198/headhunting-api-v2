name = "headhunting-api"
main = "api/index.js"
compatibility_date = "2024-01-01"

# D1数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "headhunting-db"
database_id = "ffcc6eb7-8bc2-476c-8623-9fb3fe0ee417"

# KV存储绑定
[[kv_namespaces]]
binding = "KV"
id = "8840a80d33eb4d2f868f0d401ac4cff1"

# 环境变量（敏感信息）
[vars]
ENVIRONMENT = "production"

# 开发环境
[env.development]
vars = { ENVIRONMENT = "development" }

# 生产环境
[env.production]
vars = { ENVIRONMENT = "production" }

# 生产环境 D1数据库绑定
[[env.production.d1_databases]]
binding = "DB"
database_name = "headhunting-db"
database_id = "ffcc6eb7-8bc2-476c-8623-9fb3fe0ee417"

# 生产环境 KV存储绑定
[[env.production.kv_namespaces]]
binding = "KV"
id = "8840a80d33eb4d2f868f0d401ac4cff1"
