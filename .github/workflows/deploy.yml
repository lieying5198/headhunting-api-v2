name: CI/CD - 测试与部署

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ==================== 测试任务 ====================
  test:
    name: 🧪 运行测试
    runs-on: ubuntu-latest
    steps:
      - name: 📥 拉取代码
        uses: actions/checkout@v4

      - name: 🟢 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 安装依赖
        run: npm ci

      - name: 🧪 运行测试
        run: npm test

  # ==================== 部署任务 ====================
  deploy:
    name: 🚀 部署到 Cloudflare
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: 📥 拉取代码
        uses: actions/checkout@v4

      - name: 🟢 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 安装依赖
        run: npm ci

      - name: 🚀 部署到 Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          environment: production

      - name: ✅ 部署成功
        run: |
          echo "🎉 部署完成！"
          echo "📡 API: https://headhunting-api.${{ vars.CLOUDFLARE_SUBDOMAIN }}.workers.dev/api/health"
